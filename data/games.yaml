  desc: 비가 그치지 않는 학교 복도에서 시작하는 1인칭 드림코어 걷기 게임. 웹 3D(PICO-8 16색 느낌). 화살표나 W/S로 걷고 화면을 누르면 마우스로 둘러본다. 폰은 왼손으로 끌어 걷고 오른손으로 끌어 둘러본다.
  thumb: thumb.webp
