# 게임 목록. 위에 있을수록 먼저 보인다. 게임 파일은 static/games/<slug>/index.html
# - slug: 주소 이름(/games/<slug>/)
#   title: 이름
#   desc: 한 줄 소개
#   thumb: 목록 그림(static/games/<slug>/ 안 파일 이름, 없으면 빼기)
#   hidden: true  잔인하거나 선정적인 게임. 목록에 안 나오고 주소를 아는 사람만 들어온다.
#                 게임 index.html의 <head>에도 <meta name="robots" content="noindex, nofollow">를 넣는다
- slug: still-raining
  title: still raining
  desc: 비가 그치지 않는 학교 복도에서 시작하는 1인칭 3D 드림코어 걷기 게임(PICO-8). 화살표로 걷고, Z나 X를 누른 채 위·아래로 고개를 든다. 폰은 화면 아래 단추로.
  thumb: thumb.webp
- slug: binder
  title: 100장 — 투명 포켓 바인더
  desc: 학습지 100장을 책상 위 링바인더에 하나씩 끼워 정리한다. 종이에 이름도 적을 수 있다.
- slug: jijeok
  title: 지적 하나 더
  desc: 고어 블랙코미디 미니게임. 도구를 골라 지적을 하나씩 처리한다. 피가 나옵니다.
  thumb: thumb.webp
  hidden: true
