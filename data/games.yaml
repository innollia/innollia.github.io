# 게임 목록. 위에 있을수록 먼저 보인다. 게임 파일은 static/games/<slug>/index.html
# - slug: 주소 이름(/games/<slug>/)
#   title: 이름
#   desc: 한 줄 소개
#   thumb: 목록 그림(static/games/<slug>/ 안 파일 이름, 또는 /로 시작하는 주소. 없으면 빼기)
#   url: 다른 곳에 이미 공개된 게임이면 그 주소(카드가 그리로 간다. 없으면 /games/<slug>/)
#   hidden: true  잔인하거나 선정적인 게임. 목록에 안 나오고 주소를 아는 사람만 들어온다.
#                 게임 index.html의 <head>에도 <meta name="robots" content="noindex, nofollow">를 넣는다
#   share: 공유 카드 그림(1200x630 권장, 없으면 thumb)
- slug: typing-replay
  title: 글쓰기 과정 재생기 Typing Replay
  desc: 글을 쓰고 나면 그 글이 다시 쓰이는 과정을 영상처럼 돌려 본다. 키 하나, 지운 것 하나, 한글 조합까지. 기록은 링크 안에만 담기고 서버에 올라가지 않는다.
  thumb: /games/thumbs/typing-replay.webp
  share: share.webp
- slug: still-raining
