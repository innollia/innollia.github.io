<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동화 생성기</title>
  <style>
    :root {
      --bg: #f8f8f6;
      --surface: #ffffff;
      --surface-sub: #f3f3ef;
      --ink: #18181b;
      --muted: #64646c;
      --line: #e2e2dc;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .home-link {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }

    .home-link:hover { color: var(--ink); text-decoration: underline; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .tabs {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
    }

    .tab-btn {
      border: none;
      border-right: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn:last-child { border-right: none; }
    .tab-btn:hover { color: var(--ink); background: var(--surface-sub); }
    .tab-btn.active { background: var(--ink); color: #fff; }

    .ctrl {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .seed-box {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      background: var(--surface);
    }

    .seed-box input[type="number"] {
      width: 68px;
      padding: 4px 6px;
      border: none;
      outline: none;
      font-size: 12px;
      color: var(--ink);
      background: transparent;
    }

    .seed-box .seed-shuffle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-left: 1px solid var(--line);
      background: var(--surface-sub);
      color: var(--muted);
      padding: 0 7px;
      cursor: pointer;
    }

    .seed-box .seed-shuffle:hover { color: var(--ink); background: #e9e9e3; }

    .ctrl select {
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      font-size: 12px;
      color: var(--ink);
    }

    .ctrl input[type="range"] {
      width: 68px;
      accent-color: var(--ink);
    }

    .num-val { color: var(--ink); font-weight: 600; min-width: 16px; }
    .spacer { flex: 1; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-btn:hover { color: var(--ink); background: var(--surface-sub); }
    .icon-btn.active { color: var(--ink); border-color: var(--ink); background: var(--surface-sub); }

    .icon-btn-primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      padding: 5px 10px;
    }

    .icon-btn-primary:hover { opacity: 0.9; background: var(--ink); color: #fff; }
    .icon-btn-primary:disabled { opacity: 0.5; cursor: wait; }

    svg.ico {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .hidden { display: none !important; }

    .term {
      position: relative;
      display: inline-block;
      color: var(--ink);
      font-weight: 600;
      border-bottom: 1px dashed #71717a;
      cursor: help;
    }

    .ctrl .term { color: var(--muted); font-weight: 500; }

    .term::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%);
      width: 240px;
      padding: 8px 10px;
      background: #18181b;
      color: #fafafa;
      font-size: 11.5px;
      font-weight: 400;
      line-height: 1.5;
      border-radius: 5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease;
      z-index: 40;
      white-space: normal;
      text-align: left;
    }

    .term:hover::after { opacity: 1; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .track-name { font-size: 13px; font-weight: 700; color: var(--ink); }
    .card-actions { display: inline-flex; align-items: center; gap: 6px; }

    .tech-note {
      margin: 0;
      padding: 9px 11px;
      background: var(--surface-sub);
      border-left: 2px solid var(--ink);
      font-size: 12px;
      line-height: 1.65;
      color: #3f3f46;
    }

    .story-title {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .story-body {
      font-family: "Noto Serif KR", "Batang", Georgia, serif;
      font-size: 15.5px;
      line-height: 1.85;
      color: #202024;
    }

    .story-body p { margin: 0 0 12px; }
    .story-body p:last-child { margin-bottom: 0; }

    .beat-label {
      display: inline-block;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-right: 6px;
      vertical-align: 1px;
    }

    .src-span {
      border-radius: 3px;
      transition: background-color 0.12s ease;
      cursor: help;
    }

    .src-span.origin-corpus {
      border-bottom: 1px dotted #a1a1aa;
      cursor: pointer;
    }

    .src-span.origin-corpus:hover,
    .src-span.highlighted {
      background: #fef08a;
      color: #18181b;
    }

    .src-span.origin-common:hover { background: #ecece6; }

    .src-span.origin-blend { border-bottom: 1px dotted #a8a29e; }
    .src-span.origin-blend:hover { background: #fde68a; }

    .used-tales-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    .used-tales-label { color: var(--muted); font-weight: 600; margin-right: 2px; }

    .used-tale-chip {
      background: var(--surface-sub);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11.5px;
      color: var(--ink);
      cursor: pointer;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .used-tale-chip:hover { background: #fef08a; border-color: #ca8a04; }

    .panels {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    details.panel { font-size: 12px; color: var(--muted); }
    details.panel summary {
      cursor: pointer;
      color: var(--ink);
      font-weight: 600;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tales-filter {
      margin-top: 8px;
      width: 100%;
      max-width: 260px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 12px;
      color: var(--ink);
    }

    .tales-grid {
      margin-top: 8px;
      max-height: 210px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 8px;
      background: var(--surface-sub);
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .tale-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 2px 7px;
      font-size: 11.5px;
      color: var(--ink);
      cursor: pointer;
    }

    .tale-item:hover { background: #fef08a; border-color: #ca8a04; }

    #float-tip {
      position: fixed;
      z-index: 100;
      max-width: 280px;
      padding: 6px 9px;
      background: #18181b;
      color: #fafafa;
      font-size: 11.5px;
      line-height: 1.45;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    #float-tip.show { opacity: 1; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 80;
    }

    .modal-dialog {
      width: 100%;
      max-width: 720px;
      max-height: 84vh;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-sub);
    }

    .modal-title { margin: 0; font-size: 16px; font-weight: 700; }

    .modal-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 18px 0;
    }

    .modal-tab {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }

    .modal-body {
      padding: 18px 22px 24px;
      overflow-y: auto;
      font-family: "Noto Serif KR", "Batang", Georgia, serif;
      font-size: 15px;
      line-height: 1.85;
      color: #202024;
    }

    .modal-body p { margin: 0 0 12px; }
    .modal-body p:last-child { margin-bottom: 0; }
    .modal-body mark { background: #fef08a; color: #18181b; padding: 1px 2px; border-radius: 2px; }

    .status { padding: 36px; text-align: center; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>동화 생성기</h1>
      <a class="home-link" href="/">← 홈으로</a>
    </header>

    <div class="toolbar">
      <div class="tabs" id="track-tabs">
        <button class="tab-btn active" data-track="ko_markov">한국어 마르코프</button>
        <button class="tab-btn" data-track="ko_propp">한국어 프로프</button>
        <button class="tab-btn" data-track="en_markov">영어 마르코프</button>
        <button class="tab-btn" data-track="en_propp">영어 프로프</button>
      </div>

      <div class="ctrl">
        <span class="term" data-tip="난수 생성의 시작값입니다. 같은 시드와 설정을 넣으면 언제든 똑같은 동화가 다시 생성됩니다.">시드</span>
        <div class="seed-box">
          <input type="number" id="seed-input" value="42" aria-label="시드" />
          <button class="seed-shuffle" id="random-seed-btn" title="시드만 무작위로 변경" aria-label="시드만 무작위로 변경">
            <svg class="ico" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
        </div>
      </div>

      <label class="ctrl" id="ctrl-order">
        <span class="term" data-tip="앞선 몇 개의 토큰을 보고 다음 단어를 고를지 정합니다. 1~2는 엉뚱하고 기발하며, 3~4는 원문 문장에 가까워집니다.">차수</span>
        <input type="range" id="order-range" min="1" max="4" value="2" />
        <span class="num-val" id="order-val">2</span>
      </label>

      <label class="ctrl" id="ctrl-sentences">
        <span class="term" data-tip="생성할 동화의 목표 문장 수입니다. 숫자를 높일수록 이야기가 길어집니다.">문장</span>
        <input type="range" id="sent-range" min="4" max="20" value="8" />
        <span class="num-val" id="sent-val">8</span>
      </label>

      <label class="ctrl" id="ctrl-scope">
        <span class="term" data-tip="한국 전래·창작 동화 21편만 학습할지, 그림 형제 등 세계 동화 한국어 번역본 220편을 함께 섞을지 선택합니다.">범위</span>
        <select id="scope-select">
          <option value="korean">한국 동화만</option>
          <option value="all" selected>세계 동화 포함</option>
        </select>
      </label>

      <label class="ctrl" id="ctrl-mode">
        <span class="term" data-tip="한국어 문장을 쪼개는 기준입니다. 조사 분리는 조사를 떼어내 조합을 유연하게 만들고 받침에 맞춰 다시 붙이며, 어절은 띄어쓰기 단위로 묶습니다.">단위</span>
        <select id="mode-select">
          <option value="eojeol">어절</option>
          <option value="josa">조사 분리</option>
        </select>
      </label>

      <label class="ctrl" id="ctrl-tone">
        <span class="term" data-tip="코퍼스 어휘의 가중치를 조절해 이야기의 결을 바꿉니다. 클래식·기발한·어두운 분위기를 고를 수 있습니다.">분위기</span>
        <select id="tone-select">
          <option value="classic">클래식</option>
          <option value="whimsical">기발한</option>
          <option value="dark">어두운</option>
        </select>
      </label>

      <div class="spacer"></div>
      <button class="icon-btn icon-btn-primary" id="generate-btn" title="현재 설정으로 동화 생성" aria-label="생성">
        <svg class="ico" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
    </div>

    <main id="output">
      <div class="status">동화 코퍼스를 불러오는 중...</div>
    </main>
  </div>

  <div id="float-tip"></div>

  <div class="modal-backdrop hidden" id="reader-modal" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-head">
        <h3 class="modal-title" id="modal-title">원문</h3>
        <div class="card-actions">
          <button class="icon-btn hidden" id="modal-translate-btn" title="한국어로 번역" aria-label="한국어로 번역"></button>
          <button class="icon-btn" id="modal-close-btn" title="닫기" aria-label="닫기">
            <svg class="ico" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-tabs hidden" id="modal-tabs"></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module">
    import { generateStory, loadStore } from "./engine.mjs";

    const TRACK_NAMES = {
      ko_markov: "한국어 마르코프",
      ko_propp: "한국어 프로프",
      en_markov: "영어 마르코프",
      en_propp: "영어 프로프",
    };

    const ICO = {
      copy: '<svg class="ico" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      check: '<svg class="ico" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
      translate: '<svg class="ico" viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>',
      book: '<svg class="ico" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
    };

    const GLOSSARY = {
      "마르코프 체인": "직전 몇 개의 단어만 보고 다음에 올 단어를 확률적으로 뽑아 문장을 이어가는 통계 모델입니다.",
      "어절": "띄어쓰기로 구분되는 한 덩어리입니다. 원문 문체를 그대로 살리기 좋습니다.",
      "조사 분리": "명사 뒤에 붙은 조사를 떼어내 별도 토큰으로 학습한 뒤, 생성 시 한글 받침 규칙에 맞춰 자연스럽게 다시 붙이는 방식입니다.",
      "N-gram": "연속된 N개의 토큰 묶음입니다. 차수가 낮으면 엉뚱하고 기발하며, 높을수록 원문 문장에 가까워집니다.",
      "백오프": "현재 N개 조합으로 이어질 다음 단어가 없을 때, N-1개 조합으로 한 단계 내려가 끊김 없이 문장을 이어가는 기법입니다.",
      "프로프 민담 형태론": "민속학자 블라디미르 프로프가 수많은 민담에서 추출한 공통 서사 공식입니다. 결핍→출발→시험→도구 획득→대결→귀환의 흐름을 따릅니다.",
      "코퍼스": "모델이 학습하기 위해 모아 둔 대량의 원문 텍스트 묶음입니다.",
      "토큰": "컴퓨터가 텍스트를 처리하기 위해 쪼개 놓은 기본 조각(단어, 조사, 구두점 등)입니다.",
      "구두점": "마침표, 쉼표, 느낌표 같은 문장 부호입니다. 이를 토큰으로 함께 학습해야 문장의 호흡이 살아납니다.",
    };

    let currentTrack = "ko_markov";
    const translateCache = new Map();
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));

    function esc(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function term(word) {
      return `<span class="term" data-tip="${esc(GLOSSARY[word] || "")}">${esc(word)}</span>`;
    }

    function getTechHtml(track) {
      if (track === "ko_markov") {
        return `현대 한국어 동화 ${term("코퍼스")}를 ${term("어절")} 또는 ${term("조사 분리")} 단위로 쪼개 ${term("N-gram")} ${term("마르코프 체인")} 전이 표를 만듭니다. 문장 시작에서 ${term("백오프")} 확률 샘플링으로 끝까지 이어 붙입니다.`;
      }
      if (track === "ko_propp") {
        return `고정 템플릿 없이 현대 한국어 동화 ${term("코퍼스")}의 모든 문장을 위치와 키워드로 ${term("프로프 민담 형태론")} 8단계에 자동 분류합니다. 각 단계마다 별도의 ${term("N-gram")} ${term("마르코프 체인")}을 학습해 도입부터 결말까지 실제 동화 문장으로 엮습니다.`;
      }
      if (track === "en_markov") {
        return `영문 동화 ${term("코퍼스")}를 단어와 ${term("구두점")} ${term("토큰")}으로 분해해 ${term("N-gram")} ${term("마르코프 체인")}을 학습합니다. ${term("백오프")} 샘플링으로 문장을 만든 뒤 대문자와 띄어쓰기를 정리합니다.`;
      }
      if (track === "en_propp") {
        return `고정 템플릿 없이 영문 동화 ${term("코퍼스")}의 모든 문장을 ${term("프로프 민담 형태론")} 8단계로 자동 분류하고, 단계별 전용 ${term("N-gram")} ${term("마르코프 체인")}과 분위기 어휘 가중치로 기승전결을 생성합니다.`;
      }
      return "";
    }

    async function translateEnToKo(text) {
      const key = text.trim();
      if (!key) return "";
      if (translateCache.has(key)) return translateCache.get(key);
      const paras = key.split(/\n\s*\n+/).map((p) => p.trim()).filter(Boolean);
      const out = [];
      for (const p of paras) {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=${encodeURIComponent(p)}`;
        const res = await fetch(url);
        const data = await res.json();
        out.push(data[0].map((seg) => seg[0] || "").join(""));
      }
      const joined = out.join("\n\n");
      translateCache.set(key, joined);
      return joined;
    }

    function updateControls() {
      const showSentences = currentTrack === "ko_markov" || currentTrack === "en_markov";
      const showScope = currentTrack === "ko_markov" || currentTrack === "ko_propp";
      const showMode = currentTrack === "ko_markov" || currentTrack === "ko_propp";
      const showTone = currentTrack === "ko_propp" || currentTrack === "en_propp";
      $("#ctrl-sentences").classList.toggle("hidden", !showSentences);
      $("#ctrl-scope").classList.toggle("hidden", !showScope);
      $("#ctrl-mode").classList.toggle("hidden", !showMode);
      $("#ctrl-tone").classList.toggle("hidden", !showTone);
    }

    function renderParagraphs(text) {
      return (text || "")
        .split(/\n\s*\n+/)
        .filter((p) => p.trim())
        .map((p) => `<p>${esc(p.trim())}</p>`)
        .join("");
    }

    function formatSourceTip(span) {
      if (span.origin === "common") return `여러 동화 공통 표현 (${span.total_sources}편)`;
      if (span.origin === "blend") return "조사 재조합으로 새로 생성된 표현";
      if (!span.sources || !span.sources.length) return "";
      const extra = (span.total_sources || span.sources.length) - span.sources.length;
      const names = span.sources.join(", ");
      return extra > 0 ? `출처: ${names} 외 ${extra}편 (클릭해 원문 보기)` : `출처: ${names} (클릭해 원문 보기)`;
    }

    function renderProvenanceHtml(prov, fallbackText, beats) {
      if (!prov || !Array.isArray(prov.paragraphs) || !prov.paragraphs.length) {
        return renderParagraphs(fallbackText);
      }
      return prov.paragraphs.map((spans, idx) => {
        const inner = spans.map((sp) => {
          if (sp.origin === "plain") return esc(sp.text);
          const tip = formatSourceTip(sp);
          const srcs = (sp.sources || []).join("||");
          return `<span class="src-span origin-${esc(sp.origin)}" data-tip="${esc(tip)}" data-sources="${esc(srcs)}">${esc(sp.text)}</span>`;
        }).join("");
        const beatPrefix = Array.isArray(beats) && beats[idx] && beats[idx].name_ko
          ? `<span class="beat-label">${idx + 1}. ${esc(beats[idx].name_ko)}</span>`
          : "";
        return `<p>${beatPrefix}${inner}</p>`;
      }).join("");
    }

    const floatTip = $("#float-tip");
    function showFloatTip(text, x, y) {
      if (!text) return;
      floatTip.textContent = text;
      floatTip.classList.add("show");
      const pad = 12;
      const rect = floatTip.getBoundingClientRect();
      let left = x + 12;
      let top = y - rect.height - 12;
      if (left + rect.width > window.innerWidth - pad) left = window.innerWidth - rect.width - pad;
      if (left < pad) left = pad;
      if (top < pad) top = y + 18;
      floatTip.style.left = `${left}px`;
      floatTip.style.top = `${top}px`;
    }
    function hideFloatTip() { floatTip.classList.remove("show"); }

    // Reference reader modal
    const modal = $("#reader-modal");
    const modalTitle = $("#modal-title");
    const modalTabs = $("#modal-tabs");
    const modalBody = $("#modal-body");
    const modalTransBtn = $("#modal-translate-btn");
    modalTransBtn.innerHTML = ICO.translate;

    function closeTaleReader() { modal.classList.add("hidden"); }
    $("#modal-close-btn").addEventListener("click", closeTaleReader);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeTaleReader(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !modal.classList.contains("hidden")) closeTaleReader();
    });

    function highlightNeedleInHtml(text, needle) {
      const cleanNeedle = (needle || "").replace(/^[.,!?;:"'“”‘’]+|[.,!?;:"'“”‘’]+$/g, "").trim();
      if (!cleanNeedle || cleanNeedle.length < 2) return esc(text);
      const idx = text.toLowerCase().indexOf(cleanNeedle.toLowerCase());
      if (idx === -1) return esc(text);
      return (
        esc(text.slice(0, idx)) +
        `<mark>${esc(text.slice(idx, idx + cleanNeedle.length))}</mark>` +
        esc(text.slice(idx + cleanNeedle.length))
      );
    }

    async function loadAndRenderTale(lang, title, needle) {
      modalTitle.textContent = title;
      modalBody.innerHTML = `<p style="color:var(--muted)">원문을 불러오는 중...</p>`;
      modalTransBtn.classList.add("hidden");
      modalTransBtn.classList.remove("active");

      const store = await loadStore(lang);
      const tale = store.taleMap.get(title);
      if (!tale) {
        modalBody.innerHTML = `<p style="color:var(--danger)">원문을 찾을 수 없습니다.</p>`;
        return;
      }

      const renderOrig = () => {
        modalTitle.textContent = tale.t;
        modalBody.innerHTML = tale.p.map((p) => `<p>${highlightNeedleInHtml(p, needle)}</p>`).join("");
        const mark = modalBody.querySelector("mark");
        if (mark) mark.scrollIntoView({ behavior: "smooth", block: "center" });
      };
      renderOrig();

      if (lang === "en") {
        modalTransBtn.classList.remove("hidden");
        let showingKo = false;
        let translated = null;
        modalTransBtn.onclick = async () => {
          if (!translated) {
            modalTransBtn.disabled = true;
            try {
              const koTitle = await translateEnToKo(tale.t);
              const koText = await translateEnToKo(tale.p.join("\n\n"));
              translated = { title: koTitle, text: koText };
            } catch {
              modalTransBtn.disabled = false;
              return;
            }
            modalTransBtn.disabled = false;
          }
          showingKo = !showingKo;
          modalTransBtn.classList.toggle("active", showingKo);
          if (showingKo) {
            modalTitle.textContent = translated.title;
            modalBody.innerHTML = renderParagraphs(translated.text);
            modalTransBtn.title = "영어 원문 보기";
          } else {
            renderOrig();
            modalTransBtn.title = "한국어로 번역";
          }
        };
      }
    }

    function openTaleReader(lang, titles, needle) {
      modal.classList.remove("hidden");
      if (titles.length > 1) {
        modalTabs.classList.remove("hidden");
        modalTabs.innerHTML = titles.map((t, i) =>
          `<button class="modal-tab${i === 0 ? " active" : ""}" data-title="${esc(t)}">${esc(t)}</button>`
        ).join("");
        modalTabs.querySelectorAll(".modal-tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            modalTabs.querySelectorAll(".modal-tab").forEach((b) => b.classList.toggle("active", b === btn));
            loadAndRenderTale(lang, btn.dataset.title, needle);
          });
        });
      } else {
        modalTabs.classList.add("hidden");
        modalTabs.innerHTML = "";
      }
      loadAndRenderTale(lang, titles[0], needle);
    }

    function attachTalesPanel(card, lang, scope = "all") {
      const panel = card.querySelector(".tales-panel");
      const grid = panel.querySelector(".tales-grid");
      const input = panel.querySelector(".tales-filter");
      const summaryCount = panel.querySelector(".tales-count");
      let loaded = false;
      let allTitles = [];

      function renderList(q = "") {
        const kw = q.trim().toLowerCase();
        const filtered = kw ? allTitles.filter((t) => t.toLowerCase().includes(kw)) : allTitles;
        grid.innerHTML = filtered.map((t) => `<span class="tale-item" data-title="${esc(t)}">${esc(t)}</span>`).join("")
          || `<span style="color:var(--muted)">일치하는 작품이 없습니다.</span>`;
      }

      grid.addEventListener("click", (e) => {
        const item = e.target.closest(".tale-item");
        if (item && item.dataset.title) openTaleReader(lang, [item.dataset.title], "");
      });

      panel.addEventListener("toggle", async () => {
        if (!panel.open || loaded) return;
        loaded = true;
        const store = await loadStore(lang, scope);
        allTitles = store.titles;
        summaryCount.textContent = `(${allTitles.length}편)`;
        renderList();
      });

      input.addEventListener("input", () => renderList(input.value));
    }

    function bindProvenanceEvents(card) {
      const bodyEl = card.querySelector(".story-body");
      bodyEl.addEventListener("mousemove", (e) => {
        const sp = e.target.closest(".src-span");
        if (sp && sp.dataset.tip) showFloatTip(sp.dataset.tip, e.clientX, e.clientY);
        else hideFloatTip();
      });
      bodyEl.addEventListener("mouseleave", hideFloatTip);

      bodyEl.addEventListener("click", (e) => {
        const sp = e.target.closest(".src-span.origin-corpus");
        if (!sp) return;
        const srcs = (sp.dataset.sources || "").split("||").filter(Boolean);
        if (srcs.length) {
          hideFloatTip();
          openTaleReader(card.dataset.lang, srcs, sp.textContent.trim());
        }
      });

      card.querySelectorAll(".used-tale-chip").forEach((chip) => {
        const title = chip.dataset.title;
        chip.addEventListener("mouseenter", () => {
          card.querySelectorAll(".src-span.origin-corpus").forEach((sp) => {
            if ((sp.dataset.sources || "").split("||").includes(title)) sp.classList.add("highlighted");
          });
        });
        chip.addEventListener("mouseleave", () => {
          card.querySelectorAll(".src-span.highlighted").forEach((sp) => sp.classList.remove("highlighted"));
        });
        chip.addEventListener("click", () => openTaleReader(card.dataset.lang, [title], ""));
      });
    }

    function buildCard(s) {
      const isEnglish = s.lang === "en";
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.lang = s.lang;
      card.dataset.currentTitle = s.title;
      card.dataset.currentText = s.text;

      const usedTales = (s.provenance && s.provenance.used_tales) || [];
      const usedTalesHtml = usedTales.length
        ? `<div class="used-tales-bar">
             <span class="used-tales-label">이 동화에 섞인 작품</span>
             ${usedTales.map((t) => `<span class="used-tale-chip" data-title="${esc(t)}" title="호버: 위치 강조 · 클릭: 원문 보기">${esc(t)}</span>`).join("")}
           </div>`
        : "";

      card.innerHTML = `
        <div class="card-top">
          <span class="track-name">${esc(TRACK_NAMES[s.track] || s.track)}</span>
          <div class="card-actions">
            ${isEnglish ? `<button class="icon-btn translate-btn" title="한국어로 번역" aria-label="한국어로 번역">${ICO.translate}</button>` : ""}
            <button class="icon-btn copy-btn" title="본문 복사" aria-label="본문 복사">${ICO.copy}</button>
          </div>
        </div>
        <p class="tech-note">${getTechHtml(s.track)}</p>
        <h2 class="story-title">${esc(s.title)}</h2>
        <div class="story-body">${renderProvenanceHtml(s.provenance, s.text, s.beats)}</div>
        ${usedTalesHtml}
        <div class="panels">
          <details class="panel tales-panel">
            <summary>${ICO.book} 전체 학습 작품 목록 <span class="tales-count"></span></summary>
            <input type="search" class="tales-filter" placeholder="작품 제목 검색..." />
            <div class="tales-grid"></div>
          </details>
        </div>
      `;

      const titleEl = card.querySelector(".story-title");
      const bodyEl = card.querySelector(".story-body");
      const copyBtn = card.querySelector(".copy-btn");

      if (isEnglish) {
        const transBtn = card.querySelector(".translate-btn");
        let showingKo = false;
        let translated = null;
        transBtn.addEventListener("click", async () => {
          if (!translated) {
            transBtn.disabled = true;
            try {
              const koTitle = await translateEnToKo(s.title);
              const koText = await translateEnToKo(s.text);
              translated = { title: koTitle, text: koText };
            } catch {
              transBtn.disabled = false;
              return;
            }
            transBtn.disabled = false;
          }
          showingKo = !showingKo;
          transBtn.classList.toggle("active", showingKo);
          if (showingKo) {
            titleEl.textContent = translated.title;
            bodyEl.innerHTML = renderParagraphs(translated.text);
            transBtn.title = "영어 원문 보기";
            card.dataset.currentTitle = translated.title;
            card.dataset.currentText = translated.text;
          } else {
            titleEl.textContent = s.title;
            bodyEl.innerHTML = renderProvenanceHtml(s.provenance, s.text, s.beats);
            transBtn.title = "한국어로 번역";
            card.dataset.currentTitle = s.title;
            card.dataset.currentText = s.text;
          }
        });
      }

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(`${card.dataset.currentTitle}\n\n${card.dataset.currentText}`);
          copyBtn.innerHTML = ICO.check;
          copyBtn.title = "복사됨";
          setTimeout(() => { copyBtn.innerHTML = ICO.copy; copyBtn.title = "본문 복사"; }, 1200);
        } catch {}
      });

      attachTalesPanel(card, s.lang, s.scope || "all");
      bindProvenanceEvents(card);
      return card;
    }

    async function generate() {
      const btn = $("#generate-btn");
      const out = $("#output");
      btn.disabled = true;
      out.innerHTML = `<div class="status">생성 중...</div>`;

      try {
        const story = await generateStory({
          track: currentTrack,
          seed: parseInt($("#seed-input").value, 10) || 42,
          order: parseInt($("#order-range").value, 10) || 2,
          sentences: parseInt($("#sent-range").value, 10) || 8,
          mode: $("#mode-select").value,
          tone: $("#tone-select").value,
          scope: $("#scope-select").value,
        });
        out.innerHTML = "";
        out.appendChild(buildCard(story));
      } catch (e) {
        out.innerHTML = `<div class="status" style="color:var(--danger)">오류: ${esc(e.message)}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    $$("#track-tabs .tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentTrack = btn.dataset.track;
        $$("#track-tabs .tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
        updateControls();
        generate();
      });
    });

    $("#order-range").addEventListener("input", (e) => { $("#order-val").textContent = e.target.value; });
    $("#order-range").addEventListener("change", generate);
    $("#sent-range").addEventListener("input", (e) => { $("#sent-val").textContent = e.target.value; });
    $("#sent-range").addEventListener("change", generate);
    $("#scope-select").addEventListener("change", generate);
    $("#mode-select").addEventListener("change", generate);
    $("#tone-select").addEventListener("change", generate);
    $("#random-seed-btn").addEventListener("click", () => {
      $("#seed-input").value = Math.floor(Math.random() * 100000);
      generate();
    });
    $("#generate-btn").addEventListener("click", generate);
    $("#seed-input").addEventListener("keydown", (e) => { if (e.key === "Enter") generate(); });

    updateControls();
    generate();
  </script>
</body>
</html>
