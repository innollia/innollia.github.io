<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동화 마르코프</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>동화 마르코프</h1>
      <nav class="masthead-nav">
        <a href="/fairytale-en/">English ↗</a>
        <a href="/">홈</a>
      </nav>
    </header>

    <div class="workspace">
      <article class="sheet">
        <div class="sheet-head">
          <h2 class="story-title" id="story-title">불러오는 중...</h2>
          <div class="sheet-actions">
            <button class="icon-btn icon-btn-primary" id="generate-btn" title="새 이야기 생성" aria-label="새 이야기 생성">
              <svg class="ico" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
            <button class="icon-btn" id="copy-btn" title="본문 복사" aria-label="본문 복사">
              <svg class="ico" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>
        <div class="story-body" id="story-body">
          <div class="status">동화 코퍼스를 불러오는 중...</div>
        </div>
      </article>

      <aside class="sidebar">
        <section class="side-block">
          <h3 class="side-title">설정</h3>

          <div class="field">
            <span class="field-label"><span class="term" data-tip="난수 생성의 시작값입니다. 같은 시드와 설정을 넣으면 언제든 똑같은 동화가 나옵니다.">시드</span></span>
            <div class="seed-box">
              <input type="number" id="seed-input" value="42" aria-label="시드" />
              <button class="seed-shuffle" id="random-seed-btn" title="시드만 무작위로 변경" aria-label="시드 변경">
                <svg class="ico" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
              </button>
            </div>
          </div>

          <div class="field">
            <span class="field-label"><span class="term" data-tip="앞선 몇 개의 토큰을 보고 다음 단어를 고를지 정합니다. 1~2는 엉뚱하고 기발하며, 3~4는 원문에 가까워집니다.">차수</span></span>
            <div class="field-right">
              <input type="range" id="order-range" min="1" max="4" value="2" />
              <span class="num-val" id="order-val">2</span>
            </div>
          </div>

          <div class="field">
            <span class="field-label"><span class="term" data-tip="생성할 동화의 목표 문장 수입니다.">문장</span></span>
            <div class="field-right">
              <input type="range" id="sent-range" min="4" max="20" value="8" />
              <span class="num-val" id="sent-val">8</span>
            </div>
          </div>

          <div class="field">
            <span class="field-label"><span class="term" data-tip="한국 전래·창작 동화 21편만 학습할지, 세계 동화 한국어 번역본 220편을 함께 섞을지 고릅니다.">범위</span></span>
            <select id="scope-select">
              <option value="korean">한국 동화만</option>
              <option value="all" selected>세계 동화 포함</option>
            </select>
          </div>

          <div class="field">
            <span class="field-label"><span class="term" data-tip="어절은 띄어쓰기 단위로 묶고, 조사 분리는 조사를 떼어내 조합한 뒤 받침 규칙에 맞춰 다시 붙입니다.">단위</span></span>
            <select id="mode-select">
              <option value="eojeol">어절</option>
              <option value="josa">조사 분리</option>
            </select>
          </div>
        </section>

        <section class="side-block">
          <h3 class="side-title">이 이야기에 섞인 작품</h3>
          <div class="used-list" id="used-list"></div>
        </section>

        <section class="side-block">
          <h3 class="side-title">원리</h3>
          <p class="side-note">
            동화 <span class="term" data-tip="모델이 학습하기 위해 모아 둔 원문 텍스트 묶음입니다.">코퍼스</span>를
            <span class="term" data-tip="연속된 N개의 토큰 묶음입니다.">N-gram</span>
            <span class="term" data-tip="직전 몇 개의 단어만 보고 다음 단어를 확률적으로 뽑아 이어가는 통계 모델입니다.">마르코프 체인</span>으로
            학습하고, 막힐 때는 <span class="term" data-tip="이어질 단어가 없을 때 차수를 한 단계 내려 끊김 없이 이어가는 기법입니다.">백오프</span>로 문장을 잇습니다. 본문 구절을 누르면 원문을 읽을 수 있습니다.
          </p>
          <button class="icon-btn browse-btn" id="browse-btn">
            <svg class="ico" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            전체 작품 목록
          </button>
        </section>
      </aside>
    </div>
  </div>

  <div id="float-tip"></div>

  <div class="modal-backdrop hidden" id="reader-modal" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-head">
        <h3 class="modal-title" id="modal-title">원문</h3>
        <button class="icon-btn" id="modal-close-btn" title="닫기" aria-label="닫기">
          <svg class="ico" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-tabs hidden" id="modal-tabs"></div>
      <div class="modal-search hidden" id="modal-search">
        <input type="search" id="modal-search-input" placeholder="작품 제목 검색..." />
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module">
    import { initMarkovApp } from "./app.mjs";
    initMarkovApp({
      lang: "ko",
      dataBaseUrl: "./data",
      strings: {
        generating: "생성 중...",
        loading: "원문을 불러오는 중...",
        notFound: "원문을 찾을 수 없습니다.",
        errorTitle: "오류",
        noMatch: "일치하는 작품이 없습니다.",
        catalogTitle: (n) => `학습 작품 목록 (${n}편)`,
        tipCommon: (n) => `여러 동화 공통 표현 (${n}편)`,
        tipBlend: "조사 재조합으로 새로 생성된 표현",
        tipSource: (names) => `출처: ${names} (클릭해 원문 보기)`,
        tipSourceMore: (names, extra) => `출처: ${names} 외 ${extra}편 (클릭해 원문 보기)`,
      },
    });
  </script>
</body>
</html>
