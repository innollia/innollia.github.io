<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>봉봉봉</title>
<meta name="description" content="이놀아안이 시키는 거 해드리는 가게. 게임·웹사이트·낭독·노래·신탁·봇.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dokdo&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css?v=11">
</head>
<body>
<div class="bg-stripes" aria-hidden="true"></div>

<header class="marquee">
  <a class="back" href="/">&lt; 홈-페-지</a>
  <div class="sign">
    <span class="sign-small">어서오십쇼! 이길드에!</span>
    <h1 class="sign-title">봉<span>봉</span>봉</h1>
    <span class="sign-bulbs" aria-hidden="true"></span>
  </div>
</header>

<section class="counter" aria-label="상점 주인">
  <div id="keeper" aria-hidden="true"></div>
  <div class="bubble" role="status" aria-live="polite"><p id="keeper-line"></p></div>
</section>

<div class="shop">
  <nav class="rail" id="rail" aria-label="진열대"></nav>
  <main class="shelf" id="shelf" aria-live="polite"></main>
</div>
<div class="extras" id="extras"></div>

<aside class="detail" id="detail" aria-hidden="true" aria-labelledby="detail-title" role="dialog">
  <div class="detail-slash" aria-hidden="true"></div>
  <div class="detail-panel">
    <button class="x" id="detail-close" aria-label="닫기">✕</button>
    <div class="detail-head">
      <div class="detail-icon" id="detail-icon" aria-hidden="true"></div>
      <div><p class="detail-cat" id="detail-cat"></p><h2 id="detail-title"></h2></div>
    </div>
    <p class="detail-desc" id="detail-desc"></p>
    <p class="detail-say" id="detail-say" role="status" aria-live="polite"></p>
    <div class="detail-body" id="detail-body"></div>
    <div class="detail-foot">
      <div class="detail-price"><small id="detail-price-label">가격</small><b id="detail-price">0</b></div>
      <button class="btn-buy" id="detail-buy">담기</button>
    </div>
  </div>
</aside>

<footer class="cartbar" id="cartbar">
  <ul class="cart-list" id="cart-list"></ul>
  <div class="cart-sum"><small>합계 (후불)</small><b id="cart-total">0원</b></div>
  <button class="btn-order" id="btn-order" disabled>주문하기</button>
</footer>

<dialog class="checkout" id="checkout">
  <div class="checkout-inner">
    <div class="checkout-top"><p class="receipt-top">주문번호 <b id="order-code"></b></p><button type="button" class="x" id="checkout-close" aria-label="닫기">✕</button></div>
    <h2>주문서</h2>
    <div id="order-edit">
      <ul class="order-items" id="order-items"></ul>
      <p class="order-total" id="order-total"></p>
      <p><button type="button" class="btn-sub" id="order-more">← 더 고르기</button></p>
    </div>
    <div id="dm-user-box"><p><label for="dm-user">연락받을 디스코드 사용자명 (필수)</label></p><input type="text" id="dm-user" maxlength="40" placeholder="예) bibim_99" autocomplete="off" autocapitalize="none" spellcheck="false"><p class="tiny">디스코드 설정 &gt; 내 계정에 나오는 사용자명이에요(표시 이름 말고). 이놀아안이 여기로 DM해요.</p></div>
    <p><button type="button" class="btn-buy send-big" id="send-order">디스코드로 주문 보내기</button></p>
    <p class="tiny" id="send-result" role="status"></p>
    <p class="tiny" id="send-fail" hidden>그럴 땐 <a href="https://discord.com/users/823053384633417738" target="_blank" rel="noopener">이놀아안에게 DM</a>으로 주문번호와 원하는 걸 보내 주세요.</p>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="ordername.js?v=2"></script>
<script src="shop.js?v=21"></script>
</body>
</html>
