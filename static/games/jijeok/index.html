<style>
  html, body { margin: 0; height: 100%; background: #1a1412; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  svg#game { height: 100vh; max-width: 100vw; display: block; user-select: none; -webkit-user-select: none; }
  text { font-family: "Black Han Sans", "Malgun Gothic", sans-serif; font-weight: 900; }
  .btn { cursor: pointer; }
  .btn.off { pointer-events: none; opacity: 0.35; }
  #hit { cursor: crosshair; }
  #hit.tooling { cursor: none; }
  #breath { transform-box: view-box; transform-origin: 410px 640px; animation: breath 2.4s ease-in-out infinite; }
  @keyframes breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.018, 0.985); } }
  #shiverG.s1 { animation: shiv 0.14s linear infinite; }
  #shiverG.s2 { animation: shiv2 0.08s linear infinite; }
  @keyframes shiv { 0% { transform: translate(0, 0); } 50% { transform: translate(2px, -1px); } 100% { transform: translate(-2px, 1px); } }
  @keyframes shiv2 { 0% { transform: translate(0, 0); } 33% { transform: translate(5px, -2px); } 66% { transform: translate(-5px, 2px); } 100% { transform: translate(1px, 0); } }
  #curAct { transform-box: fill-box; transform-origin: 50% 80%; }
  #curAct.a-pliers { animation: aPliers 0.18s ease-out; }
  #curAct.a-mallet { animation: aMallet 0.2s ease-out; }
  #curAct.a-stapler, #curAct.a-nail { animation: aPress 0.15s ease-out; }
  #curAct.a-peeler { transform: rotate(-25deg); }
  @keyframes aPliers { 0% { transform: scaleX(0.55); } 100% { transform: scaleX(1); } }
  @keyframes aMallet { 0% { transform: rotate(-55deg); } 40% { transform: rotate(18deg); } 100% { transform: rotate(0); } }
  @keyframes aPress { 0% { transform: translateY(16px) scaleY(0.8); } 100% { transform: translateY(0) scaleY(1); } }
  .drip { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dripIn 1.3s ease-in forwards; }
  @keyframes dripIn { to { stroke-dashoffset: 0; } }
  .dripEnd { transform-box: fill-box; transform-origin: 50% 0; transform: scale(0); animation: dripEnd 0.2s 1.2s forwards; }
  @keyframes dripEnd { to { transform: scale(1); } }
  .pop { transform-box: fill-box; animation: pop 0.7s ease-out forwards; }
  @keyframes pop { 0% { transform: translateY(0) scale(0.6); } 30% { transform: translateY(-30px) scale(1.15); } 100% { transform: translateY(-70px) scale(0.9); } }
  #ring { transform-box: fill-box; transform-origin: center; animation: ring 0.6s ease-in-out infinite; }
  @keyframes ring { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  #scene.shake { animation: shake 0.09s linear infinite; }
  @keyframes shake {
    0% { transform: translate(0, 0); } 25% { transform: translate(-14px, 9px); }
    50% { transform: translate(12px, -8px); } 75% { transform: translate(-8px, -12px); } 100% { transform: translate(0, 0); }
  }
  #bodyWrap { transition: transform 0.5s ease-in; }
  #bodyWrap.gone { transform: translate(900px, 0); }
  #bodySquash { transform-box: view-box; transform-origin: 410px 640px; }
  #bodySquash.ouch { animation: ouch 0.22s ease-out; }
  @keyframes ouch { 0% { transform: scale(1.1, 0.86); } 60% { transform: scale(0.95, 1.06); } 100% { transform: scale(1, 1); } }
  #noteCard { transition: transform 0.25s ease-out; }
  #noteCard.in { transform: translate(0, 0); }
  #noteCard.out { transform: translate(0, -170px); }
  .fly { transition: transform 0.6s cubic-bezier(.2,.7,.4,1); }
</style>

  // 팀장이 실제로 던진 지적 (director_notes·retrospective 원문)
  const NOTES = ['상점이 레퍼런스와 달라', 'HEALTH를 글씨로 적었어', '공격만 계속 하면 이겨', '전부 claude slop이야',

    '지금까지중에 최악이야', '배경이 심심하다', '왜 너가 작업하는거야', '뻔하노', '감독판이 뭐야', '주제머야',
    '이문장 빼', '그걸 왜빼', '11시인거 몰랐음', '처음들어', '아이디어 그만 좀 내', '애초에 방향이 틀렸어',

  // 몸 두 벌의 이빨·눈·다리 자리
  const FEAT = {
    0: { eyes: [[365, 380, 38, 44], [470, 374, 34, 40]], teeth: [[384, 476], [419, 481], [445, 476]], legs: [[316, 638], [488, 638]] },
    6: { eyes: [[330, 360, 36, 42], [503, 345, 22, 24]], teeth: [[346, 562], [479, 566]], legs: [[316, 646], [485, 660]] },
  };

  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = $('game');
  const wait = ms => new Promise(r => setTimeout(r, ms * SPEED));
  const rnd = n => Math.floor(Math.random() * n);
  const rf = (a, b) => a + Math.random() * (b - a);
  const el = (parent, html) => { const g = document.createElementNS(NS, 'g'); g.innerHTML = html; parent.appendChild(g); return g; };

  const G = window.__game = { phase: 'title', build: 1, ver: 10, clock: 7 * 60 + 53, end: 10 * 60 + 59, per: 12, streak: 0, earned: 0, save: () => SAVE,
    round: 0, patches: 0, answer: null, tool: null, meter: 0, gone: new Set(), pinned: 0, walk: 0, errors: [], history: [] };
  window.addEventListener('error', e => G.errors.push(String(e.message)));
  const variant = () => (G.patches ? 6 : 0);

  function blob(cx, cy, r, n = 8, jit = 0.35) {
    const pts = [];
    for (let i = 0; i < n; i++) { const a = 2 * Math.PI * i / n, rr = r * (1 + rf(-jit, jit)); pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
    let d = `M${pts[0][0].toFixed(0)} ${pts[0][1].toFixed(0)} `;
    for (let i = 0; i < n; i++) { const p0 = pts[i], p1 = pts[(i + 1) % n]; d += `Q${p0[0].toFixed(0)} ${p0[1].toFixed(0)} ${((p0[0] + p1[0]) / 2).toFixed(0)} ${((p0[1] + p1[1]) / 2).toFixed(0)} `; }
    return d + 'Z';
  }

  // ---------- 화면 ----------
  function hud() {
    $('verText').textContent = 'v' + (G.ver / 10).toFixed(1);
    $('buildText').textContent = G.build + '번 판';
    const c = Math.min(G.clock, G.end);
    $('clockText').textContent = String(Math.floor(c / 60)).padStart(2, '0') + ':' + String(c % 60).padStart(2, '0');
    $('meterFill').setAttribute('width', 400 * Math.max(0, Math.min(1, G.meter / (G.target || 100))));
  }
  // 핑계를 말할 때는 막는 도구 그림을 같이 띄운다
  function say(t) { $('bubble').style.display = t ? '' : 'none'; $('bubbleText').textContent = t || ''; $('bubbleIcon').innerHTML = t && t === G.say && G.answer ? ICON[G.answer] : ''; }
  function tag(t, red = true) {
    $('tag').style.display = t ? '' : 'none';
    $('tagText').textContent = t || '';
    $('tagText').setAttribute('fill', red ? EYE : INK);
    $('tagBox').setAttribute('fill', red ? BLOOD : EYE);
    if (t) {
      const w = Math.max(260, $('tagText').getComputedTextLength() + 70);
      $('tagBox').setAttribute('d', `M${400 - w / 2} 30 L ${400 + w / 2} 30 L ${400 + w / 2} 108 L ${400 - w / 2} 108 Z`);
    }
  }
  function showBody(on) {
    $('bodyWrap').style.display = on ? '' : 'none';
    $('body0').style.display = G.patches ? 'none' : '';
    $('body6').style.display = G.patches ? '' : 'none';
    $('dmg').setAttribute('clip-path', `url(#sil${variant()})`); $('dmg').setAttribute('mask', `url(#face${variant()})`);
  }
  function bursts(i) { document.querySelectorAll('.burst').forEach((b, k) => b.style.display = k === i ? '' : 'none'); }
  function punishBg(on) { $('bg').setAttribute('fill', on ? '#46302c' : '#3b463c'); $('floor').style.display = on ? 'none' : ''; $('floorDmg').style.display = on ? 'none' : ''; }
  function setWalk(x) { G.walk = x; $('bodyMove').setAttribute('transform', `translate(${x.toFixed(1)} 0)`); }

  // ---------- 상처 (판이 지나도 남는다) ----------
  function capDmg() { const d = $('dmg'); while (d.childNodes.length > 70) d.removeChild(d.firstChild); }
  // 같은 자리에 상처를 겹쳐 덩어리로 만들지 않는다 (아픔은 그대로)
  G.marks = [];
  function room(x, y) { if (G.marks.some(m => Math.hypot(m[0] - x, m[1] - y) < 40)) return false; G.marks.push([x, y]); if (G.marks.length > 70) G.marks.shift(); return true; }
  function drip(x, y, len) {
    return `<path class="drip" pathLength="1" d="M${x} ${y} C ${x - 4} ${y + len * 0.4}, ${x + 5} ${y + len * 0.7}, ${x} ${y + len}" fill="none" stroke="${BLOOD}" stroke-width="8"/>` +
      `<circle class="dripEnd" cx="${x}" cy="${y + len + 4}" r="6" fill="${BLOOD}"/>`;
  }
  function fly(html, x, y, dx, dy, rot) {
    const g = el($('fx'), `<g transform="translate(${x} ${y})">${html}</g>`);
    g.setAttribute('class', 'fly');
    requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.05)`; }));
    setTimeout(() => g.remove(), 700);
  }
  function spurt(x, y, n = 6, big = 1) {
    for (let i = 0; i < n; i++) {
      const a = rf(-Math.PI, 0.2), d = rf(60, 160) * big;
      fly(`<path d="${blob(0, 0, rf(7, 15) * big, 7)}" fill="${BLOOD}" stroke="${INK}" stroke-width="4"/>`, x, y, Math.cos(a) * d, Math.sin(a) * d + 40, 0);
    }
  }
  // 이빨·눈은 몸이 바뀌어도 자리를 따라가게 다시 그림
  function drawFeat() {
    const F = FEAT[variant()]; let s = '';
    F.teeth.forEach(([x, y], i) => {
      if (!G.gone.has('t' + i)) return;
      s += `<path d="${blob(x, y, 13, 7, 0.2)}" fill="${MOUTH}" stroke="${INK}" stroke-width="5"/>` + drip(x, y + 10, 46);
    });
    F.eyes.forEach(([x, y, rx, ry], i) => {
      if (G.gone.has('e' + i)) {
        const ex = x + (i ? 26 : -22), ey = y + ry + 130;
        s += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${BLOOD}" stroke="${INK}" stroke-width="9"/>` +
          `<path d="${blob(x, y + 4, rx * 0.5, 8)}" fill="${FLESH}" stroke="${INK}" stroke-width="5"/>` +
          `<path d="M${x} ${y + ry * 0.5} C ${x - 18} ${y + 70}, ${ex + 20} ${ey - 60}, ${ex} ${ey - 18}" fill="none" stroke="${INK}" stroke-width="18"/>` +
          `<path d="M${x} ${y + ry * 0.5} C ${x - 18} ${y + 70}, ${ex + 20} ${ey - 60}, ${ex} ${ey - 18}" fill="none" stroke="${FLESH}" stroke-width="9"/>` +
          `<ellipse cx="${ex}" cy="${ey}" rx="24" ry="22" fill="${EYE}" stroke="${INK}" stroke-width="7"/><circle cx="${ex + 5}" cy="${ey + 6}" r="9" fill="${INK}"/>` +
          `<path d="M${ex - 18} ${ey - 4} l 10 4 M ${ex + 16} ${ey - 10} l -9 6" stroke="${BLOOD}" stroke-width="3"/>` + drip(x + 4, y + ry - 4, 40);
      }
      const st = G.staples['e' + i] || 0;
      for (let k = 0; k < st; k++) {
        const a = -Math.PI / 2 + (k - (st - 1) / 2) * 0.55, sx = x + Math.cos(a) * (rx + 8), sy = y + Math.sin(a) * (ry + 8);
        s += `<g transform="translate(${sx.toFixed(0)} ${sy.toFixed(0)}) rotate(${(a * 180 / Math.PI + 90).toFixed(0)})">` +
          `<path d="M-13 -9 L -13 7 L 13 7 L 13 -9" fill="none" stroke="${INK}" stroke-width="10"/><path d="M-13 -9 L -13 7 L 13 7 L 13 -9" fill="none" stroke="${METAL}" stroke-width="4"/></g>` +
          `<path d="M${x + Math.cos(a) * rx * 0.9} ${y + Math.sin(a) * ry * 0.9} l ${-Math.cos(a) * 18} ${-Math.sin(a) * 16}" stroke="${BLOOD}" stroke-width="4"/>`;

    });
    $('featDmg').innerHTML = s;
  }
  // 두 눈과 입 자리: 일반 상처는 여기에 그리지 않고 밖으로 민다
  const FACE = { 0: [[365, 380, 58, 62], [470, 374, 54, 58], [416, 478, 80, 38]], 6: [[330, 360, 56, 60], [503, 345, 46, 46], [410, 565, 128, 46]] };
  function rim(p) {
    for (let pass = 0; pass < 3; pass++) {
      const e = FACE[variant()].find(([cx, cy, rx, ry]) => Math.hypot((p[0] - cx) / rx, (p[1] - cy) / ry) < 1.05);
      if (!e) return p;
      const [cx, cy, rx, ry] = e, dx = (p[0] - cx) / rx, dy = (p[1] - cy) / ry, k = Math.hypot(dx, dy);
      const a = k < 0.05 ? (Math.random() < 0.5 ? 0 : Math.PI) : Math.atan2(dy, dx);
      p = [cx + Math.cos(a) * rx * 1.25, cy + Math.sin(a) * ry * 1.25];
    }
    return p;
  }
  function near(p, q, r) { return Math.hypot(p[0] - q[0], p[1] - q[1]) < r; }
  function onBody(p) {
    const path = $('hit' + variant()), pt = svg.createSVGPoint(); pt.x = p[0]; pt.y = p[1];
    return path.isPointInFill(pt);
  }
  function legAt(p) { return FEAT[variant()].legs.findIndex(l => near(p, l, 46)); }

  // 도구 하나가 몸에 닿았을 때: 상처를 그리고, 아픔(자백 게이지 증가량)을 돌려준다
  function apply(tool, p) {
    const F = FEAT[variant()], d = $('dmg'), [x, y] = rim(p);
    if (tool === 'pliers') {
      const ti = F.teeth.findIndex((t, i) => !G.gone.has('t' + i) && near(p, t, 30));
      if (ti >= 0) {
        G.gone.add('t' + ti); drawFeat();
        fly(`<path d="M-10 -14 L 10 -14 L 6 8 L 3 26 L 0 10 L -3 26 L -6 8 Z" fill="${BONE}" stroke="${INK}" stroke-width="5"/><path d="M-2 24 l 4 10" stroke="${BLOOD}" stroke-width="5"/>`, F.teeth[ti][0], F.teeth[ti][1], rf(-160, 160), -220, rf(-300, 300));

    salt: `<path d="M-18 34 L -22 -10 C -22 -30, 22 -30, 22 -10 L 18 34 Z" fill="${EYE}" stroke="${INK}" stroke-width="6"/><path d="M-22 -8 L 22 -8" stroke="${INK}" stroke-width="5"/><circle cx="-8" cy="-19" r="3" fill="${INK}"/><circle cx="0" cy="-23" r="3" fill="${INK}"/><circle cx="8" cy="-19" r="3" fill="${INK}"/>`,
    shock: `<path d="M-28 32 L -12 -2 M 28 32 L 12 -2" stroke="${INK}" stroke-width="16"/><path d="M-28 32 L -12 -2 M 28 32 L 12 -2" stroke="${MOUTH}" stroke-width="8"/><path d="M-12 -2 L -18 -16 L -6 -14 Z M 12 -2 L 18 -16 L 6 -14 Z" fill="${METAL}" stroke="${INK}" stroke-width="5"/><path d="M-12 -22 L -2 -36 L 2 -24 L 12 -40" fill="none" stroke="${INK}" stroke-width="10"/><path d="M-12 -22 L -2 -36 L 2 -24 L 12 -40" fill="none" stroke="${EYE}" stroke-width="4"/>`,
    nail: `<path d="M0 -26 L 0 30" stroke="${INK}" stroke-width="12"/><path d="M0 -26 L 0 30" stroke="${METAL}" stroke-width="5"/><ellipse cx="0" cy="-28" rx="16" ry="6" fill="${METAL}" stroke="${INK}" stroke-width="6"/><path d="M-4 30 L 0 40 L 4 30 Z" fill="${INK}"/>`,
  };
  function toolButtons() {
    const box = $('buttons'); box.innerHTML = '';
    const T = tools(), two = T.length > 5;
    T.forEach(([id, name], i) => {
      const on = G.tool === id;
      let g;
      if (!two) {
        const cx = 86 + i * 157;
        g = el(box, `<g filter="url(#hand)"><rect x="${cx - 72}" y="990" width="144" height="156" fill="${on ? '#c9d1a8' : EYE}" stroke="${INK}" stroke-width="${on ? 14 : 9}"/>` +
          `<g transform="translate(${cx} 1046)">${ICON[id]}</g></g><text x="${cx}" y="1130" text-anchor="middle" font-size="${name.length > 3 ? 23 : 30}" fill="${INK}">${name}</text>`);
      } else {
        const cx = 103 + (i % 4) * 198, cy = i < 4 ? 1030 : 1116;
        g = el(box, `<g filter="url(#hand)"><rect x="${cx - 92}" y="${cy - 38}" width="184" height="76" fill="${on ? '#c9d1a8' : EYE}" stroke="${INK}" stroke-width="${on ? 13 : 8}"/>` +
          `<g transform="translate(${cx - 52} ${cy + 2}) scale(0.82)">${ICON[id]}</g></g><text x="${cx - 14}" y="${cy + 12}" font-size="${name.length > 3 ? 21 : 29}" fill="${INK}">${name}</text>`);
      }
      g.setAttribute('class', 'btn'); g.dataset.tool = id;
      g.addEventListener('pointerdown', () => { if (G.phase === 'torture') { G.tool = id; toolButtons(); cursorShow(true); } });
    });
  }
  function oneButton(label, fn) {
    const box = $('buttons'); box.innerHTML = '';
    const g = el(box, `<g filter="url(#hand)"><rect x="250" y="1020" width="300" height="80" fill="${EYE}" stroke="${INK}" stroke-width="10"/></g><text x="400" y="1076" text-anchor="middle" font-size="40" fill="${INK}">${label}</text>`);
    g.setAttribute('class', 'btn'); g.dataset.label = label; g.addEventListener('click', fn);
  }

  // ---------- 한 판 ----------
  function torture(limit) {
    return new Promise(res => {
      const t0 = performance.now(); let prev = t0;
      (function tick(now) {
        if (G.phase !== 'torture') return;
        const dt = (now - prev) / 1000; prev = now;
        // 몸은 재생한다: 게이지가 저절로 줄어듦
        G.meter = Math.max(0, G.meter - dt * (6 + G.round * 0.6) * (1 - 0.15 * SAVE.lv.decay));
        // 판이 갈수록 도중에 핑계를 바꾼다
        // 전기집게를 물린 동안 지진다
        if (G.shock) {
          G.shock.t += dt;
          if (!G.shock.wrong && G.tool === G.answer) {
            G.meter += dt * 30 * (1 + 0.2 * SAVE.lv.pain);
            if (Math.random() < dt * 7) spark(G.shock.p);
            if (Math.random() < dt * 1.5) { say(LINES2.zap[rnd(LINES2.zap.length)]); clearTimeout(G.sayT); G.sayT = setTimeout(() => G.phase === 'torture' && say(G.say), 650); }
          }
        }
        if (G.shock || performance.now() - (G.sizzle || 0) < 400) $('shiverG').setAttribute('class', 's2');
        if (G.switches.length && G.meter >= G.switches[0]) {
          G.switches.shift();
          const others = avail().filter(x => x.tool !== G.answer), d2 = others[rnd(others.length)];
          G.answer = d2.tool; G.say = d2.say; G.dodgeKey = d2.key; say(d2.say);
        }
        // 올리는 중: 못 박기 전까지 몸이 걸어 나간다
        if (G.answer === 'nail' && G.pinned < 1) setWalk(G.walk + dt * (FAST ? 10 : 55));
        const left = 1 - (now - t0) / limit;
        $('timerBar').setAttribute('width', Math.max(0, 760 * left));
        hud();
        if (G.meter >= G.target) return res(true);
        if (left <= 0 || G.walk > 330) return res(false);
        requestAnimationFrame(tick);
      })(t0);
    });
  }

  async function round() {
    G.round++; G.meter = 0; G.pinned = 0; G.tool = null; setWalk(0); G.shock = null;
    const note = NOTES[(G.round - 1 + G.seedOff) % NOTES.length];
    // 시각에 따라 규칙이 바뀐다: 09시 껍질, 10시 몰아치기
    const stage = G.clock >= 10 * 60 ? 3 : G.clock >= 9 * 60 ? 2 : 1;
    G.target = stage === 3 ? 140 : 100;
    G.switches = stage === 3 ? [40, 90] : G.round >= 4 ? [50] : [];
    const fresh = DODGES.find(x => x.intro === G.round);
    const d = fresh || avail()[rnd(avail().length)];
    G.answer = d.tool; G.say = d.say; G.dodgeKey = d.key;
    $('noteNo').textContent = '지적 ' + G.round;
    $('noteText').textContent = note;
    $('noteCard').setAttribute('class', 'in');
    showBody(true); $('bodyWrap').classList.remove('gone');
    say(''); tag(''); $('meter').style.display = ''; hud();
    if (stage !== G.stage) { G.stage = stage; if (stage > 1) { tag(stage === 2 ? '09시: 껍질' : '10시: 몰아치기'); await wait(1100); tag(''); } }
    if (fresh) { tag('새 도구: ' + TOOLS.find(t => t[0] === fresh.tool)[1], false); await wait(1000); tag(''); }
    G.bark = [];
    if (stage >= 2) {
      for (let k = 0; k < 3; k++) {
        let q = [rf(280, 560), rf(300, 600)];
        q = rim(q); if (!onBody(q)) q = [k ? 300 + k * 160 : 420, 600];
        G.bark.push(q);
      }
    }
    drawBark();
    await wait(450);
    say(d.say); toolButtons();
    G.phase = 'torture';
    const limit = FAST ? 3000 : Math.max(10000, 14000 - G.round * 200) + (stage >= 2 ? 2000 : 0) + (fresh ? 3000 : 0) + (stage === 3 ? 3000 : 0);
    const won = await torture(limit);
    if (G.shock) shockEnd(); G.bark = []; drawBark();
    stripEnd(); if (G.grab) { $('grab').innerHTML = ''; G.grab = null; } cursorShow(false); $('ringL').innerHTML = ''; $('pops').innerHTML = '';
    G.history.push({ note, dodge: G.dodgeKey, won });
    G.clock += G.per;
    document.querySelectorAll('.btn').forEach(b => b.classList.add('off'));
    if (won) {
      // 자백: 얼굴 확대 컷으로 터짐
      G.phase = 'burst';
      say(''); showBody(false); punishBg(true); $('meter').style.display = 'none';
      bursts(DODGES.findIndex(x => x.key === G.dodgeKey)); tag(LINES.confess[G.dodgeKey]);
      $('scene').classList.add('shake');
      await wait(1600);
      $('scene').classList.remove('shake');
      // 다시 붙음 v+0.1: 상처는 남고, 잃은 것 하나만 새로 돋는다
      G.phase = 'reattach';
      bursts(-1); punishBg(false); setWalk(0);
      G.patches++; G.ver += 1; G.streak++; G.earned++;
      if (G.streak >= 3) G.bonus = (G.bonus || 0) + 0.2 * SAVE.lv.streak;
      const gain = 1 + Math.floor(G.bonus || 0); G.bonus = (G.bonus || 0) % 1; G.build += gain;
      if (G.gone.size && G.patches > 1) { const k = [...G.gone][rnd(G.gone.size)]; G.gone.delete(k); }
      $('legDmg').innerHTML = '';
      addTape(); showBody(true); drawFeat(); hud();
      tag('v' + (G.ver / 10).toFixed(1) + (gain > 1 ? '  +' + gain + '판' : ''), false);
      await wait(1300);
    } else {
      G.phase = 'escape';
      say('확인했습니다.'); G.streak = 0;
      await wait(700);
      $('bodyWrap').classList.add('gone');
      G.build = Math.max(1, G.build - 1); G.clock += 10; hud();
      tag('-1 판');
      await wait(1100);
    }
    tag(''); $('noteCard').setAttribute('class', 'out');
    await wait(250);
  }

  function addTape() {
    // 눈·입 높이를 피한 자리에만, 네 장까지 (얼굴이 읽혀야 한다)
    const SLOTS = [262, 478, 622, 250];
    if (G.patches < 2 || G.patches > 5) return;
    const y = SLOTS[G.patches - 2] + rnd(10) - 5, r = rnd(24) - 12, dx = rnd(12) - 6;
    el($('extraTape'), `<g transform="translate(${dx} ${y - 320}) rotate(${r} 405 320)">` +
      `<path d="M405 300 C 400 322, 410 340, 404 372" fill="none" stroke="${BLOOD}" stroke-width="9"/>` +
      `<path d="M350 300 C 380 292, 430 290, 462 300 L 458 338 C 428 330, 382 332, 352 340 Z" fill="${METAL}" stroke="${TAPE_E}" stroke-width="9"/>` +
      `<path d="M362 300 l 0 36 M 448 300 l -2 36" fill="none" stroke="${TAPE_E}" stroke-width="5"/></g>`);
  }

  async function ending() {
    const win = G.build >= 39;
    $('pops').innerHTML = '';
    G.phase = 'end';
    $('timerBar').setAttribute('width', 0); $('meter').style.display = 'none';
    say(''); tag(''); bursts(-1); punishBg(false); setWalk(0);
    $('bodyWrap').classList.remove('gone'); showBody(true);
    if (!win) G.clock = G.end;
    hud();
    const got = G.earned + Math.floor(G.build / 3);
    SAVE.cash += got; SAVE.best = Math.max(SAVE.best, G.build); if (win) SAVE.wins++; store();
    $('endPanel').style.display = '';
    $('noteNo').textContent = win ? '본게임' : '마감';
    $('noteText').textContent = win ? UPG.win : '최종 ' + G.build + '번 판';
    $('noteCard').setAttribute('class', 'in');
    $('earnText').textContent = '자백 +' + got;
    if (win) {
      $('endBar').setAttribute('d', 'M130 132 L 670 132 L 670 172 L 130 172 Z');
      $('procText').textContent = '제출 완료';
    } else {
      let k = 0;
      setInterval(() => { $('procText').textContent = '처리 중' + '.'.repeat(1 + (k++ % 3)); }, 500);
    }
    G.result = { win, got };
    menu();
  }

  function again() {
    const q = new URLSearchParams(location.search); q.delete('reset'); q.delete('cash'); q.set('go', '1');
    location.search = q.toString();
  }

  function menu() {
    buttons([['강화', shop], ['다시', again]]);
  }

  // 강화 판: 누르면 바로 오른다
  function shop() {
    G.phase = 'shop';
    showBody(false); $('endPanel').style.display = 'none'; tag(''); say('');
    $('noteNo').textContent = '강화';
    $('noteText').textContent = '자백 ' + SAVE.cash + '개';
    $('noteCard').setAttribute('class', 'in');
    const box = $('shop'); box.style.display = ''; box.innerHTML = '<rect x="-40" y="-40" width="880" height="880" fill="#3b463c"/>';
    UPKEYS.forEach((k, i) => {
      const y = 40 + i * 124, lv = SAVE.lv[k], c = cost(lv), can = lv < MAXLV && SAVE.cash >= c;
      let pips = '';
      for (let j = 0; j < MAXLV; j++) pips += `<rect x="${60 + j * 40}" y="${y + 66}" width="28" height="22" fill="${j < lv ? BLOOD : '#1f251d'}" stroke="${INK}" stroke-width="5"/>`;
      const g = el(box, `<g filter="url(#hand)"><path d="M30 ${y} L 770 ${y} L 770 ${y + 108} L 30 ${y + 108} Z" fill="${EYE}" stroke="${INK}" stroke-width="9"/>${pips}` +
        `<path d="M560 ${y + 18} L 750 ${y + 18} L 750 ${y + 90} L 560 ${y + 90} Z" fill="${can ? '#c9d1a8' : '#8a8f80'}" stroke="${INK}" stroke-width="8"/></g>` +
        `<text x="60" y="${y + 50}" font-size="36" fill="${INK}">${UPG.names[k]}</text>` +
        `<text x="655" y="${y + 66}" text-anchor="middle" font-size="30" fill="${INK}">${lv >= MAXLV ? '끝' : '자백 ' + c}</text>`);
      g.setAttribute('class', 'btn'); g.dataset.up = k; g.dataset.can = can ? '1' : '';
      g.addEventListener('click', () => { if (SAVE.lv[k] >= MAXLV || SAVE.cash < cost(SAVE.lv[k])) return; SAVE.cash -= cost(SAVE.lv[k]); SAVE.lv[k]++; store(); shop(); });
    });
    buttons([['시작', again]]);
  }

  function buttons(list) {
    const box = $('buttons'); box.innerHTML = '';
    list.forEach(([label, fn], i) => {
      const cx = list.length === 1 ? 400 : 230 + i * 340;
      const g = el(box, `<g filter="url(#hand)"><rect x="${cx - 140}" y="1020" width="280" height="80" fill="${EYE}" stroke="${INK}" stroke-width="10"/></g><text x="${cx}" y="1076" text-anchor="middle" font-size="40" fill="${INK}">${label}</text>`);
      g.setAttribute('class', 'btn'); g.dataset.label = label; g.addEventListener('click', fn);
    });
  }

  async function start() {
    G.phase = 'play'; G.seedOff = rnd(NOTES.length);
    G.clock = 7 * 60 + 53 - 20 * SAVE.lv.early; G.per = 12 - SAVE.lv.fast; hud();
    $('buttons').innerHTML = ''; tag('');
    while (G.clock + G.per <= G.end && G.build < 39) await round();
    await ending();
  }

  // 테스트용: 몸 위 자리를 화면 좌표로
  G.spot = (kind, i) => {
    const F = FEAT[variant()];
    const p = kind === 'bark' ? G.bark[0] : kind === 'wound' ? (G.marks.concat(G.wounds)[0] || [420, 470]) : kind === 'leg' ? F.legs[i] : kind === 'eye' ? F.eyes[i] : kind === 'tooth' ? F.teeth[i] : [[420, 470], [350, 520], [480, 450], [440, 560]][i || 0];
    const pt = svg.createSVGPoint(); pt.x = p[0]; pt.y = p[1];
    const q = pt.matrixTransform($('bodyMove').getScreenCTM()); return [q.x, q.y];
  };

  G.staples = {}; G.wounds = []; G.bark = []; G.switches = []; G.target = 100;
  hud(); showBody(true); say('고쳤습니다!');
  $('noteNo').textContent = '팀장';
  $('noteText').textContent = '지적 하나 더';
  $('noteCard').setAttribute('class', 'in');
  if (SAVE.best) tag('최고 ' + SAVE.best + '번 판', false);
  const go = () => { $('noteCard').setAttribute('class', 'out'); start(); };
  if (P.has('go')) go(); else buttons(SAVE.cash || SAVE.best ? [['강화', shop], ['시작', go]] : [['시작', go]]);
})();
</script>
