<script>
(function() {
  'use strict';

  let rawData = null;
  let allEntries = [];
  let filteredEntries = [];

  // 필터 상태
  let state = {
    search: '',
    source: 'all',
    year: 'all',
    topic: 'all',
    sort: 'desc',
    page: 1,
    pageSize: 30
  };

  // 소스 명칭 맵
  const SOURCE_NAMES = {
    dc: { name: '디스코드', badge: 'badge-dc', prefix: '🎨 ' },
    sn: { name: '삼성노트', badge: 'badge-sn', prefix: '📝 ' },
    sc: { name: '스크리브너', badge: 'badge-sc', prefix: '📚 ' }
  };

  // 1. 초기 데이터 로드
  fetch('/chronicle/data.json')
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(data => {
      rawData = data;
      allEntries = data.entries || [];
      initUI();
    })
    .catch(err => {
      console.error('[Chronicle] Failed to load data.json:', err);
      const loading = document.getElementById('chronicle-loading');
      if (loading) {
        loading.innerHTML = '<div style="color:#ff4444; font-weight:bold;">⚠️ 데이터 로드 실패: /chronicle/data.json 을 불러올 수 없습니다.</div>';
      }
    });

  function initUI() {
    // 로딩 숨기고 컨트롤 표시
    document.getElementById('chronicle-loading').style.display = 'none';
    document.getElementById('chronicle-stats-bar').style.display = 'grid';
    document.getElementById('chronicle-controls').style.display = 'block';
    document.getElementById('chronicle-pagination').style.display = 'flex';

    // 통계 표시
    if (rawData.stats) {
      document.getElementById('stat-total').innerText = rawData.stats.n.toLocaleString();
      document.getElementById('stat-chars').innerText = (Math.round(rawData.stats.chars / 10000)) + '만 자';
      document.getElementById('stat-imgs').innerText = rawData.stats.imgs + '장';
    }

    // 소스 카운트 표시
    let cntDc = 0, cntSn = 0, cntSc = 0;
    allEntries.forEach(e => {
      if (e.s === 'dc') cntDc++;
      else if (e.s === 'sn') cntSn++;
      else if (e.s === 'sc') cntSc++;
    });
    document.getElementById('cnt-all').innerText = allEntries.length;
    document.getElementById('cnt-dc').innerText = cntDc;
    document.getElementById('cnt-sn').innerText = cntSn;
    document.getElementById('cnt-sc').innerText = cntSc;

    // 주제(Topics) 버튼 생성
    const topicContainer = document.getElementById('topic-filters');
    topicContainer.innerHTML = '';
    const allTopicBtn = document.createElement('button');
    allTopicBtn.type = 'button';
    allTopicBtn.className = 'filter-btn active';
    allTopicBtn.dataset.topic = 'all';
    allTopicBtn.innerText = '전체';
    topicContainer.appendChild(allTopicBtn);

    const topics = rawData.topics || [];
    topics.forEach(tp => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'filter-btn';
      btn.dataset.topic = tp;
      btn.innerText = tp;
      topicContainer.appendChild(btn);
    });

    // 이벤트 리스너 바인딩
    bindEvents();

    // 초기 필터 적용 및 렌더
    applyFilters();
  }

  function bindEvents() {
    // 검색창 디바운스
    const searchInput = document.getElementById('chronicle-search');
    let debounceTimer = null;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        state.search = e.target.value.trim().toLowerCase();
        state.page = 1;
        applyFilters();
      }, 200);
    });

    // 검색어 지우기
    document.getElementById('btn-clear-search').addEventListener('click', () => {
      searchInput.value = '';
      state.search = '';
      state.page = 1;
      applyFilters();
    });

    // 랜덤 메모
    document.getElementById('btn-random-memo').addEventListener('click', () => {
      if (filteredEntries.length === 0) return;
      const randIdx = Math.floor(Math.random() * filteredEntries.length);
      const chosen = filteredEntries[randIdx];
      // 해당 메모만 보이도록 검색창에 ID 또는 제목 채우기
      state.search = chosen.ti || chosen.id;
      searchInput.value = state.search;
      state.page = 1;
      applyFilters();
      window.scrollTo({ top: document.getElementById('chronicle-controls').offsetTop - 20, behavior: 'smooth' });
    });

    // 출처 필터 버튼들
    document.querySelectorAll('#source-filters .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#source-filters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.source = btn.dataset.src;
        state.page = 1;
        applyFilters();
      });
    });

    // 연도 필터 버튼들
    document.querySelectorAll('#year-filters .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#year-filters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.year = btn.dataset.year;
        state.page = 1;
        applyFilters();
      });
    });

    // 주제 필터 버튼들
    document.getElementById('topic-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('#topic-filters .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.topic = btn.dataset.topic;
      state.page = 1;
      applyFilters();
    });

    // 정렬 변경
    document.getElementById('sort-order').addEventListener('change', (e) => {
      state.sort = e.target.value;
      state.page = 1;
      applyFilters();
    });

    // 페이지네이션
    document.getElementById('pg-prev').addEventListener('click', () => {
      if (state.page > 1) {
        state.page--;
        renderList();
        scrollToTop();
      }
    });

    document.getElementById('pg-next').addEventListener('click', () => {
      const maxPage = Math.ceil(filteredEntries.length / state.pageSize) || 1;
      if (state.page < maxPage) {
        state.page++;
        renderList();
        scrollToTop();
      }
    });
  }

  function scrollToTop() {
    const listEl = document.getElementById('chronicle-list');
    if (listEl) {
      window.scrollTo({ top: listEl.offsetTop - 60, behavior: 'smooth' });
    }
  }

  function applyFilters() {
    filteredEntries = allEntries.filter(entry => {
      // 1. 소스 필터
      if (state.source !== 'all' && entry.s !== state.source) {
        return false;
      }

      // 2. 연도 필터
      if (state.year !== 'all') {
        const entryYear = entry.t ? entry.t.substring(0, 4) : '';
        if (entryYear !== state.year) return false;
      }

      // 3. 주제 필터
      if (state.topic !== 'all' && entry.tp !== state.topic) {
        return false;
      }

      // 4. 검색어 필터
      if (state.search) {
        const q = state.search;
        let matched = false;
        if (entry.ti && entry.ti.toLowerCase().includes(q)) matched = true;
        if (!matched && entry.bd && entry.bd.toLowerCase().includes(q)) matched = true;
        if (!matched && entry.p && entry.p.toLowerCase().includes(q)) matched = true;
        if (!matched && entry.tg && entry.tg.some(t => t.toLowerCase().includes(q))) matched = true;
        if (!matched && entry.id && entry.id.toLowerCase().includes(q)) matched = true;
        if (!matched && entry.ms && entry.ms.some(m => (m.x && m.x.toLowerCase().includes(q)) || (m.a && m.a.toLowerCase().includes(q)))) {
          matched = true;
        }
        if (!matched) return false;
      }

      return true;
    });

    // 정렬
    filteredEntries.sort((a, b) => {
      const ta = a.t || '';
      const tb = b.t || '';
      return state.sort === 'asc' ? ta.localeCompare(tb) : tb.localeCompare(ta);
    });

    document.getElementById('matched-count-num').innerText = filteredEntries.length.toLocaleString();

    renderList();
  }

  function renderList() {
    const listEl = document.getElementById('chronicle-list');
    const total = filteredEntries.length;

    if (total === 0) {
      listEl.innerHTML = '<div style="text-align:center; padding:40px; color:#88b0a0; border:1px dashed #1a5944; background:rgba(0,0,0,0.3);">' +
        '조건에 맞는 메모가 없습니다. 검색어나 필터를 변경해 보세요.</div>';
      document.getElementById('pg-info').innerText = '0 / 0';
      document.getElementById('pg-prev').disabled = true;
      document.getElementById('pg-next').disabled = true;
      return;
    }

    const maxPage = Math.ceil(total / state.pageSize) || 1;
    if (state.page > maxPage) state.page = maxPage;

    const startIdx = (state.page - 1) * state.pageSize;
    const endIdx = Math.min(startIdx + state.pageSize, total);
    const paged = filteredEntries.slice(startIdx, endIdx);

    document.getElementById('pg-info').innerText = state.page + ' / ' + maxPage;
    document.getElementById('pg-prev').disabled = state.page <= 1;
    document.getElementById('pg-next').disabled = state.page >= maxPage;

    let html = '';
    paged.forEach(entry => {
      html += renderMemoCard(entry);
    });
    listEl.innerHTML = html;
  }

  function renderMemoCard(entry) {
    const srcInfo = SOURCE_NAMES[entry.s] || { name: entry.s, badge: 'badge-sn', prefix: '' };
    const isSealed = Boolean(entry.z);
    const cardClass = 'memo-card src-' + (entry.s || 'unknown') + (isSealed ? ' is-sealed' : '');

    // 날짜 포맷
    let timeStr = entry.t ? entry.t.replace('T', ' ') : '';

    // 배지
    let badgesHtml = '<span class="badge ' + srcInfo.badge + '">' + srcInfo.prefix + srcInfo.name + '</span>';
    if (entry.tp) {
      badgesHtml += '<span class="badge badge-topic">#' + escapeHtml(entry.tp) + '</span>';
    }
    if (entry.tg && Array.isArray(entry.tg)) {
      entry.tg.forEach(t => {
        if (t && t !== '.') {
          badgesHtml += '<span class="badge badge-topic">#' + escapeHtml(t) + '</span>';
        }
      });
    }
    if (isSealed) {
      badgesHtml += '<span class="badge badge-sealed">🔒 봉인됨</span>';
    }

    // 경로
    let pathHtml = entry.p ? '<div class="meta-path">' + escapeHtml(entry.p) + '</div>' : '';

    // 제목
    let title = entry.ti ? escapeHtml(entry.ti) : (timeStr + ' 기록');

    // 본문 / 내용 구성
    let bodyHtml = '';

    if (isSealed) {
      bodyHtml = '<div class="sealed-box">' +
        '<div class="sealed-title">🔒 백일몽 보안관리부 기밀 봉인 문서</div>' +
        '<div class="sealed-desc">이 메모는 백일몽 내부 규정에 의해 암호화된 상태입니다.<br>(' + (entry.n || 0) + '자 분량)</div>' +
        '</div>';
    } else if (entry.ms && Array.isArray(entry.ms) && entry.ms.length > 0) {
      // 디스코드 메시지 스레드 렌더링
      bodyHtml += '<div class="chat-thread">';
      entry.ms.forEach(m => {
        const isMe = m.me === 1;
        bodyHtml += '<div class="chat-msg' + (isMe ? ' is-me' : '') + '">';
        bodyHtml += '<div class="chat-msg-header">';
        bodyHtml += '<span class="chat-author' + (isMe ? ' is-me-author' : '') + '">[' + escapeHtml(m.a || '익명') + ']</span>';
        if (m.t) {
          bodyHtml += '<span class="chat-time">' + escapeHtml(m.t.replace('T', ' ')) + '</span>';
        }
        bodyHtml += '</div>';

        if (m.re) {
          bodyHtml += '<div class="chat-reply">↳ ' + escapeHtml(m.re) + '</div>';
        }

        if (m.x) {
          bodyHtml += '<div class="chat-text">' + formatContent(m.x) + '</div>';
        }

        if (m.im && Array.isArray(m.im)) {
          bodyHtml += renderImagesGrid(m.im);
        }
        bodyHtml += '</div>';
      });
      bodyHtml += '</div>';
    } else if (entry.bd) {
      // 일반 노트 본문
      bodyHtml += '<div class="card-body-text">' + formatContent(entry.bd) + '</div>';
    }

    // 직접 첨부된 이미지 (entry.im)
    if (entry.im && Array.isArray(entry.im) && entry.im.length > 0) {
      bodyHtml += renderImagesGrid(entry.im);
    }

    // 주석/안내문 (entry.nt)
    if (entry.nt && Array.isArray(entry.nt) && entry.nt.length > 0) {
      bodyHtml += '<div class="card-notes-box">';
      entry.nt.forEach(note => {
        bodyHtml += '<div>💡 ' + escapeHtml(note) + '</div>';
      });
      bodyHtml += '</div>';
    }

    return '<div class="memo-card-wrapper">' +
      '<div class="' + cardClass + '">' +
        '<div class="card-meta">' +
          '<div class="meta-badges">' + badgesHtml + '</div>' +
          '<div class="meta-time">' + timeStr + '</div>' +
        '</div>' +
        pathHtml +
        '<h3 class="card-title">' + title + '</h3>' +
        bodyHtml +
      '</div>' +
    '</div>';
  }

  function renderImagesGrid(imgs) {
    let out = '<div class="card-images-grid">';
    imgs.forEach(item => {
      const srcPath = item[0] ? ('/chronicle/' + item[0]) : '';
      if (srcPath) {
        out += '<img src="' + srcPath + '" loading="lazy" class="memo-img-thumb" alt="메모 첨부" onclick="openLightbox(\'' + srcPath + '\')">';
      }
    });
    out += '</div>';
    return out;
  }

  // 텍스트 포맷 (코드블록, 이스케이프)
  function formatContent(text) {
    if (!text) return '';
    
    // 코드 블록 처리 (```code```)
    const codeBlockRegex = /```([\s\S]*?)```/g;
    let parts = [];
    let lastIndex = 0;
    let match;

    while ((match = codeBlockRegex.exec(text)) !== null) {
      if (match.index > lastIndex) {
        parts.push(escapeHtml(text.substring(lastIndex, match.index)).replace(/\n/g, '<br>'));
      }
      parts.push('<pre><code>' + escapeHtml(match[1].trim()) + '</code></pre>');
      lastIndex = match.index + match[0].length;
    }

    if (lastIndex < text.length) {
      parts.push(escapeHtml(text.substring(lastIndex)).replace(/\n/g, '<br>'));
    }

    return parts.join('');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // 전역 라이트박스 제어
  window.openLightbox = function(src) {
    const lb = document.getElementById('chronicle-lightbox');
    const img = document.getElementById('lightbox-img');
    if (lb && img) {
      img.src = src;
      lb.style.display = 'flex';
    }
  };

  window.closeLightbox = function() {
    const lb = document.getElementById('chronicle-lightbox');
    if (lb) {
      lb.style.display = 'none';
      document.getElementById('lightbox-img').src = '';
    }
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeLightbox();
    }
  });

})();
</script>
